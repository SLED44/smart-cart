name: Supabase keep-alive

# Supabase free-tier pauses projects after 7 days without "sufficient activity".
#
# History:
#   - v1 did a read-only GET twice a week — Supabase sent pause warnings anyway
#     (July 2026): trivial read pings don't count as activity.
#   - v2 did a daily verified WRITE — Supabase paused the project anyway on
#     2026-07-08, one minute AFTER a successful verified write. Once their
#     scanner flags a project, the pause apparently proceeds regardless.
#
# So v3 stops trying to merely prevent the pause and makes the system
# self-healing:
#
#   1. Daily verified write (real Postgres activity, read-back nonce check).
#   2. If the write fails because the project is paused, restore it via the
#      Supabase Management API, wait for it to come healthy, and retry the
#      write. The run only fails if restore itself fails — which is when a
#      human actually needs to look (GitHub emails the repo owner on failure).
#   3. Each run re-enables this workflow via the GitHub API, resetting
#      GitHub's 60-day "disable scheduled workflows in inactive repos" timer.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL           e.g. https://odwkznptayhobwjgegin.supabase.co
#   SUPABASE_SERVICE_KEY   service_role secret from Supabase dashboard
#   SUPABASE_ACCESS_TOKEN  personal access token (dashboard → Account → Access
#                          Tokens) — needed only for the auto-restore path.
#                          Note: PATs don't expire but CAN be revoked; if
#                          auto-restore starts failing with 401, mint a new one.
#
# Run history: github.com/SLED44/smart-cart/actions

on:
  schedule:
    # Daily at 09:23 UTC. Off-the-hour minute because GitHub delays/drops
    # crons scheduled at :00 during peak congestion.
    - cron: "23 9 * * *"
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  actions: write  # needed by the self re-enable step

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive write (auto-restore if paused)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_KEY}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_KEY secret"
            exit 1
          fi

          ref=$(echo "${SUPABASE_URL}" | sed -E 's#https?://([^.]+)\..*#\1#')
          nonce="run-${RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"

          # Upsert + read-back verify. Returns 0 only if Postgres provably
          # processed this run's write.
          write_and_verify() {
            local status body
            status=$(curl -sS -o /tmp/write_body -w "%{http_code}" --max-time 30 \
              -X POST "${SUPABASE_URL}/rest/v1/kv" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "[{\"key\":\"keepalive:last_ping\",\"value\":{\"nonce\":\"${nonce}\"}}]" \
              || echo "000")
            echo "Write responded with HTTP ${status}"
            if [ "${status}" != "201" ] && [ "${status}" != "200" ]; then
              cat /tmp/write_body 2>/dev/null || true
              return 1
            fi
            body=$(curl -sS --max-time 30 \
              "${SUPABASE_URL}/rest/v1/kv?key=eq.keepalive%3Alast_ping&select=value" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" || true)
            if ! printf '%s' "${body}" | grep -q "${nonce}"; then
              echo "Read-back body: ${body}"
              return 1
            fi
            return 0
          }

          if write_and_verify; then
            echo "✓ keep-alive write verified (${nonce})"
            exit 0
          fi

          echo "Write failed — project is likely paused. Attempting restore."
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Project appears paused and SUPABASE_ACCESS_TOKEN is not set, so auto-restore can't run. Restore manually at https://supabase.com/dashboard/project/${ref} and add the secret (dashboard → Account → Access Tokens)."
            exit 1
          fi

          restore_status=$(curl -sS -o /tmp/restore_body -w "%{http_code}" --max-time 30 \
            -X POST "https://api.supabase.com/v1/projects/${ref}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" -d '{}' || echo "000")
          echo "Restore request responded with HTTP ${restore_status}"
          case "${restore_status}" in
            2*) ;;  # accepted
            *)
              cat /tmp/restore_body 2>/dev/null || true
              echo "::error::Restore request failed. Restore manually: https://supabase.com/dashboard/project/${ref}"
              exit 1
              ;;
          esac

          # Restores take a few minutes. Poll up to 15 min for ACTIVE_HEALTHY.
          for i in $(seq 1 45); do
            sleep 20
            proj_status=$(curl -sS --max-time 30 \
              "https://api.supabase.com/v1/projects/${ref}" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' \
              || echo "UNKNOWN")
            echo "Poll ${i}: project status = ${proj_status}"
            if [ "${proj_status}" = "ACTIVE_HEALTHY" ]; then
              break
            fi
          done

          # Give PostgREST a moment after the DB reports healthy, then retry.
          sleep 30
          if write_and_verify; then
            echo "✓ project auto-restored and keep-alive write verified (${nonce})"
            exit 0
          fi
          echo "::error::Restore was requested but the keep-alive write still fails. Check https://supabase.com/dashboard/project/${ref}"
          exit 1

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling via the API resets that timer, so the cron
      # keeps firing even if nothing is committed for months.
      - name: Reset GitHub's 60-day scheduled-workflow disable timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
          echo "✓ workflow re-enabled (60-day timer reset)"
